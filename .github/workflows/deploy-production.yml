name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit SHA to deploy (defaults to current main)
        required: false
        type: string

      statement_action:
        description: Preserve current statement AI state, or explicitly enable/disable
        required: false
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      reconcile_screening_usage:
        description: Verify or settle the one failed S1.4 screening using private generation metadata
        required: false
        default: none
        type: choice
        options: [none, inspect, apply]
      reconcile_screening_s16_usage:
        description: Сверить или учесть единственный S1.6; без inference и деплоя
        required: false
        default: none
        type: choice
        options: [none, inspect, apply]
      statement_screening_only:
        description: One authorized S1.4 candidate screening, no deploy or model activation
        required: false
        default: false
        type: boolean
      statement_screening_s16_only:
        description: Один утверждённый прогон S1.6, без деплоя и переключения модели
        required: false
        default: false
        type: boolean
      statement_screening_s18_only:
        description: Один утверждённый прогон S1.8 с report v3, без деплоя и смены модели
        required: false
        default: false
        type: boolean
      diagnose_statement_s19_only:
        description: Только чтение сохранённого S1.8 и offline replay, без inference и деплоя
        required: false
        default: false
        type: boolean
      statement_comparison_s111_only:
        description: S1.11 synthetic comparison only; requires separate C6 owner approval
        required: false
        default: false
        type: boolean
      comparison_authorized_sha:
        description: Exact implementation SHA approved separately by owner for C6 (empty means no authorization)
        required: false
        default: ''
        type: string
      inspect_statement_only:
        description: Check statement AI readiness without emitting secrets or budget values
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  screen-statement:
    if: ${{ inputs.statement_screening_only && !inputs.statement_screening_s16_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && !inputs.statement_screening_s18_only && !inputs.diagnose_statement_s19_only && !inputs.statement_comparison_s111_only }}
    name: One bounded candidate screening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exclusive mode and successful exact-source CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECT_ONLY: ${{ inputs.inspect_statement_only }}
        run: |
          set -eu
          test "$INSPECT_ONLY" != true
          gh run list --workflow=ci.yml --commit="$GITHUB_SHA" --status=success --limit=10 --json headSha,conclusion > "$RUNNER_TEMP/screening-ci.json"
          python3 - "$GITHUB_SHA" "$RUNNER_TEMP/screening-ci.json" <<'PYCI'
          import json,sys
          assert any(x['headSha']==sys.argv[1] and x['conclusion']=='success' for x in json.load(open(sys.argv[2])))
          PYCI
      - name: Build exact operator bundle
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-screening-$GITHUB_SHA"
          mkdir "$bundle"
          CGO_ENABLED=0 go build -trimpath -o "$bundle/grace-statement-admin" ./cmd/statement-admin
          cp internal/pdfextract/testdata/columns.pdf internal/pdfextract/testdata/cards.pdf internal/pdfextract/testdata/turnover-roles-ru.pdf "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_SHA"
          cp deployments/production/statement-screening.sh "$bundle/run.sh"
          chmod 755 "$bundle" "$bundle/grace-statement-admin"
          chmod 644 "$bundle/"*.pdf "$bundle/SOURCE_SHA" "$bundle/run.sh"
          (cd "$bundle" && sha256sum grace-statement-admin *.pdf SOURCE_SHA run.sh > SHA256SUMS)
      - name: Configure pinned SSH client
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Execute the single fixed authorization
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-screening-$GITHUB_SHA"
          remote="/tmp/grace-statement-screening-$GITHUB_SHA"
          ssh grace-deploy@195.133.195.190 "mkdir '$remote'"
          scp -r "$bundle/." "grace-deploy@195.133.195.190:$remote/"
          ssh grace-deploy@195.133.195.190 "sh '$remote/run.sh' '$remote' '$GITHUB_SHA'"

  screen-statement-s16:
    if: ${{ inputs.statement_screening_s16_only && !inputs.statement_screening_only && !inputs.inspect_statement_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.statement_action == 'preserve' || inputs.statement_action == '') && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && !inputs.statement_screening_s18_only && !inputs.diagnose_statement_s19_only && !inputs.statement_comparison_s111_only }}
    name: Один ограниченный прогон S1.6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверка единственного режима и CI точного коммита
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECT_ONLY: ${{ inputs.inspect_statement_only }}
          OLD_SCREENING: ${{ inputs.statement_screening_only }}
          RECONCILE_MODE: ${{ inputs.reconcile_screening_usage }}
          STATEMENT_ACTION: ${{ inputs.statement_action }}
        run: |
          set -eu
          test "$INSPECT_ONLY" != true
          test "$OLD_SCREENING" != true
          case "$RECONCILE_MODE" in ''|none) : ;; *) exit 2 ;; esac
          case "$STATEMENT_ACTION" in ''|preserve) : ;; *) exit 2 ;; esac
          gh run list --workflow=ci.yml --commit="$GITHUB_SHA" --status=success --limit=10 --json headSha,conclusion > "$RUNNER_TEMP/screening-ci.json"
          python3 - "$GITHUB_SHA" "$RUNNER_TEMP/screening-ci.json" <<'PYCI'
          import json,sys
          assert any(x['headSha']==sys.argv[1] and x['conclusion']=='success' for x in json.load(open(sys.argv[2])))
          PYCI
      - name: Сборка операторского комплекта точного коммита
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-screening-$GITHUB_SHA"
          mkdir "$bundle"
          CGO_ENABLED=0 go build -trimpath -o "$bundle/grace-statement-admin" ./cmd/statement-admin
          cp internal/pdfextract/testdata/columns.pdf internal/pdfextract/testdata/cards.pdf internal/pdfextract/testdata/turnover-roles-ru.pdf "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_SHA"
          cp deployments/production/statement-screening-s16.sh "$bundle/run.sh"
          chmod 755 "$bundle" "$bundle/grace-statement-admin"
          chmod 644 "$bundle/"*.pdf "$bundle/SOURCE_SHA" "$bundle/run.sh"
          (cd "$bundle" && sha256sum grace-statement-admin *.pdf SOURCE_SHA run.sh > SHA256SUMS)
      - name: Настройка SSH с закреплённым ключом сервера
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Исполнение единственного разрешения S1.6
        id: s16-run
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-screening-$GITHUB_SHA"
          remote="/tmp/grace-statement-screening-$GITHUB_SHA"
          ssh grace-deploy@195.133.195.190 "mkdir '$remote'"
          scp -r "$bundle/." "grace-deploy@195.133.195.190:$remote/"
          ssh grace-deploy@195.133.195.190 "sh '$remote/run.sh' '$remote' '$GITHUB_SHA'"

      - name: Чтение приватного итога S1.6 без значений расхода и ID
        if: ${{ always() && (steps.s16-run.outcome == 'success' || steps.s16-run.outcome == 'failure') && !inputs.statement_comparison_s111_only }}
        run: |
          ssh grace-deploy@195.133.195.190 'python3 - '"$GITHUB_SHA" < scripts/research/inspect-statement-screening-s16.py

  screen-statement-s18:
    if: ${{ inputs.statement_screening_s18_only && !inputs.statement_screening_s16_only && !inputs.statement_screening_only && !inputs.inspect_statement_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.statement_action == 'preserve' || inputs.statement_action == '') && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && !inputs.diagnose_statement_s19_only && !inputs.statement_comparison_s111_only }}
    name: Один ограниченный прогон S1.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверка единственного режима и CI точного коммита
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSPECT_ONLY: ${{ inputs.inspect_statement_only }}
          OLD_SCREENING: ${{ inputs.statement_screening_only }}
          RECONCILE_MODE: ${{ inputs.reconcile_screening_usage }}
          STATEMENT_ACTION: ${{ inputs.statement_action }}
        run: |
          set -eu
          test "$INSPECT_ONLY" != true
          test "$OLD_SCREENING" != true
          case "$RECONCILE_MODE" in ''|none) : ;; *) exit 2 ;; esac
          case "$STATEMENT_ACTION" in ''|preserve) : ;; *) exit 2 ;; esac
          ci_run=$(gh run list --workflow=ci.yml --commit="$GITHUB_SHA" --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          case "$ci_run" in ''|*[!0-9]*) exit 2 ;; esac
          gh run view "$ci_run" --json headSha,status,conclusion,jobs > "$RUNNER_TEMP/screening-ci.json"
          python3 scripts/research/verify-screening-source-ci.py "$GITHUB_SHA" "$RUNNER_TEMP/screening-ci.json"
          gh run view 39502669662 --json headSha,status,conclusion,jobs > "$RUNNER_TEMP/postmerge-ci.json"
          python3 scripts/research/verify-screening-source-ci.py 938b37062f6756c8f01106a26217752b5a4797ea "$RUNNER_TEMP/postmerge-ci.json"
      - name: Сборка операторского комплекта точного коммита
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-screening-$GITHUB_SHA"
          mkdir "$bundle"
          CGO_ENABLED=0 go build -trimpath -o "$bundle/grace-statement-admin" ./cmd/statement-admin
          cp internal/pdfextract/testdata/columns.pdf internal/pdfextract/testdata/cards.pdf internal/pdfextract/testdata/turnover-roles-ru.pdf "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_SHA"
          cp deployments/production/statement-screening-s18.sh "$bundle/run.sh"
          chmod 755 "$bundle" "$bundle/grace-statement-admin"
          chmod 644 "$bundle/"*.pdf "$bundle/SOURCE_SHA" "$bundle/run.sh"
          (cd "$bundle" && sha256sum grace-statement-admin *.pdf SOURCE_SHA run.sh > SHA256SUMS)
      - name: Настройка SSH с закреплённым ключом сервера
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Исполнение единственного разрешения S1.8
        id: s18-run
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-screening-$GITHUB_SHA"
          remote="/tmp/grace-statement-screening-$GITHUB_SHA"
          ssh grace-deploy@195.133.195.190 "mkdir '$remote'"
          scp -r "$bundle/." "grace-deploy@195.133.195.190:$remote/"
          ssh grace-deploy@195.133.195.190 "sh '$remote/run.sh' '$remote' '$GITHUB_SHA'"

      - name: Чтение приватного итога S1.8 без значений расхода и ID
        if: ${{ always() && (steps.s18-run.outcome == 'success' || steps.s18-run.outcome == 'failure') && !inputs.statement_comparison_s111_only }}
        run: |
          ssh grace-deploy@195.133.195.190 'python3 - '"$GITHUB_SHA" < scripts/research/inspect-statement-screening-s18.py

  compare-statement-s111:
    if: ${{ inputs.statement_comparison_s111_only && !inputs.statement_screening_only && !inputs.statement_screening_s16_only && !inputs.statement_screening_s18_only && !inputs.diagnose_statement_s19_only && !inputs.inspect_statement_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && (inputs.statement_action == 'preserve' || inputs.statement_action == '') }}
    name: S1.11 separately authorized synthetic comparison
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact authorized source and every CI job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORIZED_SHA: ${{ inputs.comparison_authorized_sha }}
        run: |
          set -eu
          test "$AUTHORIZED_SHA" = "$GITHUB_SHA"
          ci_run=$(gh run list --workflow=ci.yml --commit="$GITHUB_SHA" --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          case "$ci_run" in ''|*[!0-9]*) exit 2 ;; esac
          gh run view "$ci_run" --json headSha,status,conclusion,jobs > "$RUNNER_TEMP/comparison-ci.json"
          python3 scripts/research/verify-screening-source-ci.py "$GITHUB_SHA" "$RUNNER_TEMP/comparison-ci.json"
      - name: Build exact operator bundle
        run: |
          set -eu
          bundle="$RUNNER_TEMP/grace-statement-comparison-$GITHUB_SHA"
          mkdir "$bundle"
          CGO_ENABLED=0 go build -trimpath -o "$bundle/grace-statement-admin" ./cmd/statement-admin
          cp internal/pdfextract/testdata/columns.pdf internal/pdfextract/testdata/cards.pdf internal/pdfextract/testdata/turnover-roles-ru.pdf "$bundle/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_SHA"
          cp deployments/production/statement-comparison-s111.sh "$bundle/run.sh"
          cp scripts/research/inspect-statement-comparison-s111.py "$bundle/inspect.py"
          chmod 755 "$bundle" "$bundle/grace-statement-admin"
          chmod 644 "$bundle/"*.pdf "$bundle/SOURCE_SHA" "$bundle/run.sh" "$bundle/inspect.py"
          (cd "$bundle" && sha256sum grace-statement-admin *.pdf SOURCE_SHA run.sh inspect.py > SHA256SUMS)
      - name: Configure pinned SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Execute separately authorized C6 once
        env:
          AUTHORIZED_SHA: ${{ inputs.comparison_authorized_sha }}
        run: |
          set -eu
          test "$AUTHORIZED_SHA" = "$GITHUB_SHA"
          bundle="$RUNNER_TEMP/grace-statement-comparison-$GITHUB_SHA"
          remote="/tmp/grace-statement-comparison-$GITHUB_SHA"
          ssh grace-deploy@195.133.195.190 "mkdir '$remote'"
          scp -r "$bundle/." "grace-deploy@195.133.195.190:$remote/"
          ssh grace-deploy@195.133.195.190 "sh '$remote/run.sh' '$remote' '$GITHUB_SHA' '$GITHUB_SHA'"

  diagnose-statement-s19:
    if: ${{ inputs.diagnose_statement_s19_only && !inputs.statement_screening_only && !inputs.statement_screening_s16_only && !inputs.statement_screening_s18_only && !inputs.inspect_statement_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && (inputs.statement_action == 'preserve' || inputs.statement_action == '') && !inputs.statement_comparison_s111_only }}
    name: Бесплатная диагностика сохранённого S1.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Offline privacy and mode gates
        run: |
          python3 scripts/research/test-statement-s19-diagnosis.py
          python3 scripts/research/test-screening-workflow-modes.py
          go test ./scripts/research/s19-replay
      - name: Configure pinned SSH client
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Read only fixed synthetic selections and closed reasons
        run: |
          ssh grace-deploy@195.133.195.190 'python3 -' < scripts/research/diagnose-statement-s19.py > "$RUNNER_TEMP/s19-projection.json"
      - name: Replay using previous Go validation and scorer
        run: |
          scripts/research/replay-statement-s19.sh "$RUNNER_TEMP/s19-projection.json" > "$RUNNER_TEMP/s19-replay.json"
          cat "$RUNNER_TEMP/s19-replay.json"
      - name: Retain only sanitized diagnostic artifacts
        if: ${{ always() && !inputs.statement_comparison_s111_only }}
        uses: actions/upload-artifact@v7
        with:
          name: statement-s19-sanitized
          path: |
            ${{ runner.temp }}/s19-projection.json
            ${{ runner.temp }}/s19-replay.json
          retention-days: 7
          if-no-files-found: error

  inspect-statement:
    if: ${{ (inputs.inspect_statement_only || inputs.reconcile_screening_usage == 'inspect' || inputs.reconcile_screening_usage == 'apply') && !inputs.statement_screening_only && !inputs.statement_screening_s16_only && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && !inputs.statement_screening_s18_only && !inputs.diagnose_statement_s19_only && !inputs.statement_comparison_s111_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure pinned SSH client
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Check readiness without exporting runtime values
        if: ${{ inputs.reconcile_screening_usage != 'inspect' && inputs.reconcile_screening_usage != 'apply' && !inputs.statement_comparison_s111_only }}
        run: |
          ssh grace-deploy@195.133.195.190 'bash -s' <<'REMOTE'
          set -eu
          api=$(docker ps -q --filter label=com.docker.compose.project=grace-production --filter label=com.docker.compose.service=api)
          postgres=$(docker ps -q --filter label=com.docker.compose.project=grace-production --filter label=com.docker.compose.service=postgres)
          test -n "$api" && test -n "$postgres"
          docker exec "$api" /bin/sh -ec 'test "${GRACE_AI_ENABLED:-false}" = true && test -r /run/secrets/openrouter_api_key'
          docker exec "$api" /bin/sh -ec 'case "${GRACE_STATEMENT_AI_ENABLED:-false}" in true) echo statement_ai_runtime_enabled ;; false) echo statement_ai_runtime_disabled ;; *) exit 1 ;; esac'
          # Emit only fixed error/scorer codes from our synthetic report, never usage.
          report=$(find /opt/grace/shared -maxdepth 1 -name 'statement-qualification-*.json' -type f | sort | tail -n 1)
          if [ -n "$report" ]; then
            grep -oE '"error":"[a-z_]+"|"codes":\[[a-z_",]*\]|"validation":\[[a-zA-Z0-9_":,.-]*\]|"coverage":\[[a-zA-Z0-9_":,.-]*\]|"name":"(columns|cards)"|"passed":(true|false)' "$report" || true
          fi
          uncertain=$(docker exec "$postgres" psql -U grace -d grace -Atc "SELECT EXISTS(SELECT 1 FROM ai_usage WHERE status='uncertain' AND purpose='statement' AND generation_id LIKE 'statement-qualification:%');")
          if [ "$uncertain" = t ]; then echo 'statement_qualification_usage_requires_review'; fi
          ready=$(docker exec "$postgres" psql -U grace -d grace -Atc "SELECT grace_ai_remaining() >= 140000 AND NOT EXISTS(SELECT 1 FROM ai_usage WHERE status='uncertain');")
          test "$ready" = t
          echo 'Statement activation prerequisites passed; no configuration, budget or usage values exported.'
          REMOTE

      - name: Diagnose fixed synthetic field locators without values
        if: ${{ inputs.reconcile_screening_usage != 'inspect' && inputs.reconcile_screening_usage != 'apply' && !inputs.statement_comparison_s111_only }}
        run: |
          ssh grace-deploy@195.133.195.190 'python3 -' < scripts/research/diagnose-statement-smoke.py

      - name: Verify or settle only the fixed S1.4 uncertain reservation
        if: ${{ inputs.reconcile_screening_usage == 'inspect' || inputs.reconcile_screening_usage == 'apply' && !inputs.statement_comparison_s111_only }}
        env:
          RECONCILE_IDS: ${{ secrets.GRACE_STATEMENT_SCREENING_GENERATION }}
          RECONCILE_MODE: ${{ inputs.reconcile_screening_usage }}
        run: |
          set -eu
          script="/opt/grace/shared/statement-reconcile-screening-$GITHUB_RUN_ID.py"
          scp scripts/ops-reconcile-statement-screening.py "grace-deploy@195.133.195.190:$script"
          trap 'ssh grace-deploy@195.133.195.190 "rm -f $script"' EXIT
          case "$RECONCILE_MODE" in inspect) flag='' ;; apply) flag='--apply' ;; *) exit 2 ;; esac
          printf '%s' "$RECONCILE_IDS" | ssh grace-deploy@195.133.195.190 "python3 $script $flag"

      - name: Inspect fixed screening outcome without billing values
        if: always()
        run: |
          ssh grace-deploy@195.133.195.190 'python3 -' < scripts/research/inspect-statement-screening.py

  reconcile-statement-s16:
    if: ${{ (inputs.reconcile_screening_s16_usage == 'inspect' || inputs.reconcile_screening_s16_usage == 'apply') && !inputs.statement_screening_only && !inputs.statement_screening_s16_only && !inputs.inspect_statement_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.statement_action == 'preserve' || inputs.statement_action == '') && !inputs.statement_screening_s18_only && !inputs.diagnose_statement_s19_only && !inputs.statement_comparison_s111_only }}
    name: Сверка единственного расхода S1.6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Настройка SSH с проверенным ключом сервера
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"
      - name: Сверка приватного отчёта и точный учёт
        env:
          RECONCILE_MODE: ${{ inputs.reconcile_screening_s16_usage }}
        run: |
          set -eu
          script="/opt/grace/shared/statement-reconcile-s16-$GITHUB_RUN_ID.py"
          trap 'ssh grace-deploy@195.133.195.190 "rm -f $script"' EXIT
          scp scripts/ops-reconcile-statement-screening-s16.py "grace-deploy@195.133.195.190:$script"
          case "$RECONCILE_MODE" in inspect) flag='' ;; apply) flag='--apply' ;; *) exit 2 ;; esac
          ssh grace-deploy@195.133.195.190 "python3 $script $flag"
      - name: Итоговая проверка ledger без раскрытия значений
        if: always()
        run: |
          ssh grace-deploy@195.133.195.190 'python3 - 9e89ae08b7ec0b2b60d642b7f2c3d29a7f52598f' < scripts/research/inspect-statement-screening-s16.py

  deploy:
    if: ${{ !inputs.inspect_statement_only && !inputs.statement_screening_only && !inputs.statement_screening_s16_only && (inputs.reconcile_screening_usage == 'none' || inputs.reconcile_screening_usage == '') && (inputs.reconcile_screening_s16_usage == 'none' || inputs.reconcile_screening_s16_usage == '') && !inputs.statement_screening_s18_only && !inputs.diagnose_statement_s19_only && !inputs.statement_comparison_s111_only }}
    name: Deploy owner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release SHA and successful CI
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          release_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          if ! printf '%s' "$release_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "$release_sha is not reachable from main" >&2
            exit 1
          fi
          successful_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=success&event=push" \
            --jq '.total_count')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "No successful CI push run exists for $release_sha" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Build production bundle
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          mkdir -p /tmp/grace-release
          ./scripts/build-production-bundle.sh /tmp/grace-release
          {
            echo 'GRACE_DOMAIN=graceapp.ru'
            echo 'GRACE_IMAGE_OWNER=qahnaarln'
            echo 'GRACE_SECRETS_DIR=/opt/grace/shared/secrets'
            echo 'GRACE_HTTP_PORT=80'
            echo 'GRACE_HTTPS_PORT=443'
            echo "RELEASE_TAG=sha-$RELEASE_SHA"
          } > /tmp/grace-release/release.env

      - name: Configure pinned SSH client
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 deployments/production/known_hosts "$HOME/.ssh/known_hosts"

      - name: Upload exact release bundle
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh grace-deploy@195.133.195.190 \
            "install -d -m 0750 /opt/grace/releases/$RELEASE_SHA"
          scp -r /tmp/grace-release/. \
            "grace-deploy@195.133.195.190:/opt/grace/releases/$RELEASE_SHA/"

      - name: Authenticate VPS to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh grace-deploy@195.133.195.190 \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy and verify internal health
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh grace-deploy@195.133.195.190 \
            "/opt/grace/releases/$RELEASE_SHA/deploy.sh $RELEASE_SHA"

      - name: Apply explicit Statement AI activation after synthetic qualification
        if: ${{ inputs.statement_action == 'enable' || inputs.statement_action == 'disable' && !inputs.statement_comparison_s111_only }}
        env:
          STATEMENT_ACTION: ${{ inputs.statement_action }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          case "$STATEMENT_ACTION" in enable|disable) ;; *) exit 1 ;; esac
          ssh grace-deploy@195.133.195.190 \
            "/opt/grace/releases/$RELEASE_SHA/statement-ai.sh $STATEMENT_ACTION"

      - name: Verify enabled Statement AI in exact runtime image
        if: ${{ inputs.statement_action == 'enable' && !inputs.statement_comparison_s111_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh grace-deploy@195.133.195.190 'bash -s' -- "$RELEASE_SHA" <<'REMOTE'
          set -eu
          expected_sha="$1"
          api=$(docker ps -q --filter label=com.docker.compose.project=grace-production --filter label=com.docker.compose.service=api)
          test -n "$api"
          image=$(docker inspect --format '{{.Config.Image}}' "$api")
          test "$image" = "ghcr.io/qahnaarln/grace-api:sha-$expected_sha"
          docker exec "$api" /bin/sh -ec 'test "$GRACE_STATEMENT_AI_ENABLED" = true; exec grace-statement-admin -mode=check'
          echo 'Exact release image and enabled Statement AI runtime verified.'
          REMOTE

      - name: Verify public authentication and application
        run: ./scripts/check-public-entrypoint.sh https://graceapp.ru

      - name: Log out VPS from GHCR
        if: always()
        run: ssh grace-deploy@195.133.195.190 'docker logout ghcr.io || true'
