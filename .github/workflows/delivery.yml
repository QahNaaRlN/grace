name: Delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: delivery-main
  cancel-in-progress: false

jobs:
  guard:
    name: Verify source CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.source.outputs.owner }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Resolve and verify source revision
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            source_sha="$WORKFLOW_RUN_SHA"
          else
            source_sha="$DISPATCH_SHA"
            successful_runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&status=success&event=push" \
              --jq '.total_count')"
            if [ "$successful_runs" -lt 1 ]; then
              echo "No successful CI push run exists for $source_sha" >&2
              exit 1
            fi
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$source_sha" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }} image
    needs: guard
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile
          - service: pdf-extractor
            dockerfile: Dockerfile.pdf-extractor
          - service: web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ needs.guard.outputs.owner }}/grace-${{ matrix.service }}:${{ needs.guard.outputs.tag }}
            ghcr.io/${{ needs.guard.outputs.owner }}/grace-${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record published digest
        run: echo "${{ matrix.service }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
