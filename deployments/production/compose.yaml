name: grace-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grace
      POSTGRES_USER: grace
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - grace-postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, pg_isready -U grace -d grace]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  migrate:
    image: migrate/migrate:v4.18.2
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        exec migrate -path=/migrations
        -database="postgres://grace:$$(cat /run/secrets/postgres_password)@postgres:5432/grace?sslmode=disable"
        up
    secrets:
      - postgres_password
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - backend
    logging: *default-logging

  pdf-extractor:
    image: ghcr.io/${GRACE_IMAGE_OWNER:?GRACE_IMAGE_OWNER is required}/grace-pdf-extractor:${RELEASE_TAG:?RELEASE_TAG is required}
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 16
    tmpfs:
      - /tmp:size=33554432,mode=700,uid=10001,gid=10001,noexec,nosuid,nodev
    volumes:
      - grace-pdf-socket:/run/grace-pdf
    healthcheck:
      test: [CMD, test, -S, /run/grace-pdf/extractor.sock]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 6s
    logging: *default-logging

  api:
    image: ghcr.io/${GRACE_IMAGE_OWNER:?GRACE_IMAGE_OWNER is required}/grace-api:${RELEASE_TAG:?RELEASE_TAG is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pdf-extractor:
        condition: service_healthy
    environment:
      GRACE_PDF_EXTRACTOR_SOCKET: /run/grace-pdf/extractor.sock
      GRACE_STATEMENT_AI_ENABLED: ${GRACE_STATEMENT_AI_ENABLED:-false}
      GRACE_STATEMENT_AI_POLICY: ${GRACE_STATEMENT_AI_POLICY:-}
      APP_PORT: '8080'
      APP_ENV: production
      GRACE_AUTH_MODE: ${GRACE_AUTH_MODE:-locked}
      GRACE_PUBLIC_URL: https://${GRACE_DOMAIN:?GRACE_DOMAIN is required}
      GRACE_SMTP_HOST: ${GRACE_SMTP_HOST:-}
      GRACE_SMTP_PORT: ${GRACE_SMTP_PORT:-587}
      GRACE_SMTP_SECURITY: ${GRACE_SMTP_SECURITY:-starttls}
      GRACE_SMTP_USERNAME: ${GRACE_SMTP_USERNAME:-}
      GRACE_SMTP_PASSWORD: ${GRACE_SMTP_PASSWORD:-}
      GRACE_SMTP_FROM: ${GRACE_SMTP_FROM:-}
      GRACE_EMAIL_MONTHLY_BUDGET: ${GRACE_EMAIL_MONTHLY_BUDGET:-1500}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      DATABASE_URL: postgres://grace:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/grace?sslmode=disable
      CORS_ORIGINS: https://${GRACE_DOMAIN:?GRACE_DOMAIN is required}
      GRACE_ASSISTANT_ROUTING_ENABLED: 'false'
    volumes:
      - grace-pdf-socket:/run/grace-pdf:ro
    networks:
      - backend
      - edge
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  web:
    image: ghcr.io/${GRACE_IMAGE_OWNER:?GRACE_IMAGE_OWNER is required}/grace-web:${RELEASE_TAG:?RELEASE_TAG is required}
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      GRACE_DOMAIN: ${GRACE_DOMAIN:?GRACE_DOMAIN is required}
    ports:
      - ${GRACE_HTTP_PORT:?GRACE_HTTP_PORT is required}:80
      - ${GRACE_HTTPS_PORT:?GRACE_HTTPS_PORT is required}:443
      - ${GRACE_HTTPS_PORT:?GRACE_HTTPS_PORT is required}:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    logging: *default-logging

secrets:
  postgres_password:
    file: ${GRACE_SECRETS_DIR:?GRACE_SECRETS_DIR is required}/postgres_password

volumes:
  grace-pdf-socket:
  grace-postgres:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
