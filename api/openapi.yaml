openapi: 3.1.0
info:
  title: Grace API
  version: 0.3.0
  description: Financial events, postings and confirmed receipt details. Money uses integer minor units.
servers:
  - url: http://localhost:8080
paths:
  /api/meta:
    get:
      operationId: getMeta
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Accounts with balances derived from postings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/categories:
    get:
      operationId: listCategories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /api/v1/financial-events:
    get:
      operationId: listFinancialEvents
      responses:
        '200':
          description: Recent financial events with postings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FinancialEvent' }
  /api/v1/financial-events/purchases:
    post:
      operationId: createPurchase
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/incomes:
    post:
      operationId: createIncome
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/debt-payments:
    post:
      operationId: createDebtPayment
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/transfers:
    post:
      operationId: createTransfer
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransfer' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/refunds:
    post:
      operationId: createRefund
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefund' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/receipts:
    get:
      operationId: listReceipts
      responses:
        '200':
          description: Recent confirmed receipts with ordered items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Receipt' }
    post:
      operationId: createReceipt
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReceipt' }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '201': { $ref: '#/components/responses/Receipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/receipts/{receiptId}:
    get:
      operationId: getReceipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '404':
          description: Receipt not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
  responses:
    Event:
      description: Created event or result of an idempotent retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FinancialEvent' }
    Receipt:
      description: Confirmed receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    ValidationError:
      description: Request violates the financial contract
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency key was used with another payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Meta:
      type: object
      required: [service, version]
      properties:
        service: { type: string }
        version: { type: string }
    Account:
      type: object
      required: [id, name, type, currency, balanceMinor, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [debit, credit, installment, cash] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        balanceMinor: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    CreateAccount:
      type: object
      additionalProperties: false
      required: [name, type, currency, openingBalanceMinor]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [debit, credit, installment, cash] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        openingBalanceMinor: { type: integer, format: int64 }
    Category:
      type: object
      required: [id, name, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [expense, income] }
        createdAt: { type: string, format: date-time }
    Posting:
      type: object
      required: [id, accountId, accountName, direction, amountMinor, currency]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
    FinancialEvent:
      type: object
      required: [id, kind, source, merchant, description, occurredAt, createdAt, postings]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [purchase, income_received, internal_transfer, refund, debt_payment] }
        source: { type: string, enum: [manual, bank_import, receipt] }
        categoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        categoryName: { oneOf: [{ type: string }, { type: 'null' }] }
        originalEventId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        merchant: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        postings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Posting' }
    CreateSingleAccountEvent:
      type: object
      additionalProperties: false
      required: [accountId, amountMinor, merchant, description, occurredAt]
      properties:
        accountId: { type: string, format: uuid }
        categoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        merchant: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    CreateTransfer:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, amountMinor, description, occurredAt]
      properties:
        sourceAccountId: { type: string, format: uuid }
        destinationAccountId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    CreateRefund:
      type: object
      additionalProperties: false
      required: [originalEventId, amountMinor, merchant, description, occurredAt]
      properties:
        originalEventId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        merchant: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    ReceiptItem:
      type: object
      required: [id, position, name, quantityMilli, unitPriceMinor, lineTotalMinor]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        name: { type: string }
        quantityMilli: { type: integer, format: int64, minimum: 1 }
        unitPriceMinor: { type: integer, format: int64, minimum: 1 }
        lineTotalMinor: { type: integer, format: int64, minimum: 1 }
    Receipt:
      type: object
      required: [id, purchaseEventId, seller, issuedAt, currency, totalMinor, fiscalDocumentNumber, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        purchaseEventId: { type: string, format: uuid }
        seller: { type: string }
        issuedAt: { type: string, format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totalMinor: { type: integer, format: int64, minimum: 1 }
        fiscalDocumentNumber: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReceiptItem' }
    CreateReceiptItem:
      type: object
      additionalProperties: false
      required: [name, quantityMilli, unitPriceMinor, lineTotalMinor]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        quantityMilli: { type: integer, format: int64, minimum: 1 }
        unitPriceMinor: { type: integer, format: int64, minimum: 1 }
        lineTotalMinor: { type: integer, format: int64, minimum: 1 }
    CreateReceipt:
      type: object
      additionalProperties: false
      required: [purchaseEventId, seller, issuedAt, items]
      properties:
        purchaseEventId: { type: string, format: uuid }
        seller: { type: string, minLength: 1, maxLength: 200 }
        issuedAt: { type: string, format: date-time }
        fiscalDocumentNumber: { type: string, maxLength: 160 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/CreateReceiptItem' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
