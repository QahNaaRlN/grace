        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryName' }
      responses:
        '201':
          description: Personal expense category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      operationId: listCategories
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items, icons]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
                  icons:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryIcon' }
  /api/v1/categories/{categoryId}:
    patch:
      operationId: renameExpenseCategory
      description: SPEC-0042. Changes the name and/or icon of a personal category.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Personal category updated; references retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteExpenseCategory
      description: >-
        SPEC-0042. Deletes a personal category. Its operations move to moveTo in
        the same transaction; expectedOperations comes from the delete preview
        and guards against operations added meanwhile.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expectedOperations, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: moveTo, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                type: object
                required: [movedOperations]
                properties:
                  movedOperations: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/categories/{categoryId}/delete-preview:
    post:
      operationId: previewCategoryDeletion
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Operations that the deletion would move
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/categories/{categoryId}/hidden:
    put:
      operationId: hideCategory
      description: SPEC-0042. Hides a category from this owner's choices for new operations.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Category hidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unhideCategory
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Category shown again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/financial-events:
    get:
      operationId: listFinancialEvents
      parameters:
        - { name: categoryId, in: query, description: Category UUID or uncategorized (purchases only); applied before the 100-event limit, schema: { type: string } }
        - { name: from, in: query, description: Inclusive local calendar date Asia/Yekaterinburg, schema: { type: string, format: date } }
        - { name: to, in: query, description: Exclusive local calendar date Asia/Yekaterinburg, schema: { type: string, format: date } }
        - { name: accountId, in: query, description: SPEC-0043. Events with a posting on this account, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [purchase, income_received, internal_transfer, refund, debt_payment, balance_adjustment] } }
        - { name: q, in: query, description: Case-insensitive substring of merchant or description, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, description: nextCursor of the previous page, schema: { type: string } }
        - { name: limit, in: query, description: Page size; default 100, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: voided, in: query, description: SPEC-0041. true lists only voided operations; otherwise they are excluded, schema: { type: boolean } }
      responses:
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: >-
            A page of financial events with postings, newest first, with totals
            for every local day on the page computed over the whole filter.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, dayTotals]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FinancialEvent' }
                  nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
                  dayTotals:
                    type: array
                    items:
                      type: object
                      required: [date, currency, inflowMinor, outflowMinor]
                      description: Internal transfers are excluded; with accountId only that account's postings count.
                      properties:
                        date: { type: string, format: date }
                        currency: { type: string }
                        inflowMinor: { type: integer, format: int64, minimum: 0 }
                        outflowMinor: { type: integer, format: int64, minimum: 0 }
  /api/v1/financial-events/{eventId}:
    patch:
      operationId: correctFinancialEvent
      description: >-
        SPEC-0041. Corrects an operation in place: descriptive fields always;
        amount, account and kind only without a receipt, settlement,
        subscription or refund link. Every change is kept in the history.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancialEventCorrection' }
      responses:
        '200':
          description: Corrected operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/FinancialEventConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/financial-events/{eventId}/void:
    post:
      operationId: voidFinancialEvent
      description: >-
        SPEC-0041. Voids an operation: its postings move to an archive, so it no
        longer counts in balances or analytics; the record and history remain.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, reason]
              properties:
                revision: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Voided operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/AuthenticationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/FinancialEventConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/financial-events/{eventId}/history:
    get:
      operationId: financialEventHistory
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Corrections, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [revision, changes, createdAt]
                      properties:
                        revision: { type: integer }
                        createdAt: { type: string, format: date-time }
                        changes:
                          type: array
                          items:
                            type: object
                            required: [field, before, after]
                            properties:
                              field: { type: string, enum: [merchant, description, occurred, kind, category, amountMinor, account, destinationAccount, voided] }
                              before: {}
                              after: {}
        '401': { $ref: '#/components/responses/AuthenticationError' }
  /api/v1/financial-events/purchases:
    post:
      operationId: createPurchase
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/AuthenticationError' }, '503': { $ref: '#/components/responses/AuthenticationError' } }
  /api/v1/financial-events/incomes:
    post:
      operationId: createIncome
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/AuthenticationError' }, '503': { $ref: '#/components/responses/AuthenticationError' } }
  /api/v1/financial-events/debt-payments:
    post:
      operationId: createDebtPayment
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/AuthenticationError' }, '503': { $ref: '#/components/responses/AuthenticationError' } }
  /api/v1/financial-events/transfers:
    post:
      operationId: createTransfer
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransfer' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/AuthenticationError' }, '503': { $ref: '#/components/responses/AuthenticationError' } }
  /api/v1/financial-events/refunds:
    post:
      operationId: createRefund
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefund' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthenticationError' }, '403': { $ref: '#/components/responses/AuthenticationError' }, '503': { $ref: '#/components/responses/AuthenticationError' } }
  /api/v1/receipts:
    get:
      operationId: listReceipts
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Recent confirmed receipts with ordered items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
