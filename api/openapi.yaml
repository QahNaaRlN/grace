openapi: 3.1.0
info:
  title: Grace API
  version: 0.7.0
  description: Deterministic financial events, receipts, obligations, confirmed import drafts, and read-only analytics. Money uses integer minor units.
servers:
  - url: http://localhost:8080
security:
  - SessionCookie: []
paths:
  /api/v1/payment-reminders:
    get:
      operationId: listPaymentReminders
      responses:
        '200':
          description: Last 100 owner-scoped reminder delivery states.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PaymentReminderStatus' } }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSubscription
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/subscriptions/{subscriptionId}:
    parameters:
      - { name: subscriptionId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSubscription
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/subscriptions/{subscriptionId}/expenses:
    parameters:
      - { name: subscriptionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSubscriptionExpenses
      responses:
        '200':
          description: Last 100 linked purchases, independent of the recent-event picker.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FinancialEvent' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: linkSubscriptionExpense
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionExpense' }
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionExpense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/loans/{obligationId}:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLoan
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateLoan
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanDetailsInput' }
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/loans/{obligationId}/documents:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadLoanDocument
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDocument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/loans/{obligationId}/documents/{documentId}:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadLoanDocument
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/loans/{obligationId}/schedule-drafts:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: copyPaymentSchedule
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '201':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentScheduleDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/loans/{obligationId}/schedule-drafts/{draftId}:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editPaymentSchedule
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentScheduleEdit' }
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentScheduleDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/loans/{obligationId}/schedule-drafts/{draftId}/apply:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: applyPaymentSchedule
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentScheduleConfirm' }
      responses:
        '200':
          description: Owner-scoped commitment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentScheduleDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/receipt-drafts:
    post:
      operationId: uploadReceiptPhoto
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [photo], properties: { photo: { type: string, format: binary } } }
      responses:
        '201':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/receipt-drafts/{draftId}:
    parameters:
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getReceiptDraft
      responses:
        '200':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: editReceiptDraft
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditReceiptDraft' }
      responses:
        '200':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: cancelReceiptDraft
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/receipt-drafts/{draftId}/extract:
    parameters:
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: extractReceiptPhoto
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/receipt-drafts/{draftId}/previews:
    parameters:
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewReceiptDraft
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [revision], properties: { revision: { type: integer, format: int64 } } }
      responses:
        '201':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraftPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/receipt-drafts/{draftId}/confirmations:
    parameters:
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmReceiptDraft
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [previewId, hash], properties: { previewId: { type: string, format: uuid }, hash: { type: string, minLength: 64, maxLength: 64 } } }
      responses:
        '200':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/assistant/capabilities:
    get:
      operationId: getAICapabilities
      responses:
        '200':
          description: Enabled modes, data disclosure, consent and shared experiment allowance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AICapabilities' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/assistant/consents:
    post:
      operationId: grantAIConsent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, policyHash]
              additionalProperties: false
              properties:
                scope: { type: string, enum: [analysis, receipt] }
                policyHash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Consent granted for the current named provider and data scope.
          content:
            application/json:
              schema: { type: object, required: [granted], properties: { granted: { type: boolean } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/assistant/consents/{scope}:
    parameters:
      - { name: scope, in: path, required: true, schema: { type: string, enum: [analysis, receipt] } }
    delete:
      operationId: revokeAIConsent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: Consent revoked; confirmed finance is unchanged. }
  /api/assistant/conversations:
    post:
      operationId: createAIConversation
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '201':
          description: Private conversation created.
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/assistant/conversations/{conversationId}:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAIConversation
      responses:
        '200':
          description: Owner-scoped questions, fact snapshots and interpretations.
          content:
            application/json:
              schema:
                type: object
                required: [id, messages]
                properties:
                  id: { type: string, format: uuid }
                  messages: { type: array, items: { $ref: '#/components/schemas/AIConversationMessage' } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAIConversation
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': { description: Conversation removed; financial provenance remains. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/assistant/conversations/{conversationId}/messages:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: analyzeCalendarMonth
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, month]
              additionalProperties: false
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
                month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: Saved answer or safe failed turn with deterministic facts; replay has no second inference cost.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIConversationMessage' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/imports/csv:
    post:
      operationId: uploadImportCSV
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: sourceId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, description: 'UTF-8 full Operations sheet A:O; data starts at row 5; maximum 16 MiB.' }
      responses:
        '201': { description: New CSV draft, content: { application/json: { schema: { $ref: '#/components/schemas/ImportBatch' } } } }
        '200': { description: Existing draft or replay, content: { application/json: { schema: { $ref: '#/components/schemas/ImportBatch' } } } }
        '400': { $ref: '#/components/responses/ImportError' }
        '401': { $ref: '#/components/responses/ImportError' }
        '403': { $ref: '#/components/responses/ImportError' }
        '409': { $ref: '#/components/responses/ImportError' }
        '413': { $ref: '#/components/responses/ImportError' }
        '422': { $ref: '#/components/responses/ImportError' }
        '500': { $ref: '#/components/responses/ImportError' }
  /api/imports/batches/{batchId}/month:
    get:
      operationId: getImportMonth
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200': { description: Complete-batch monthly reconciliation, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMonthReport' } } } }
        '400': { $ref: '#/components/responses/ImportError' }
        '401': { $ref: '#/components/responses/ImportError' }
        '404': { $ref: '#/components/responses/ImportError' }
        '500': { $ref: '#/components/responses/ImportError' }
  "/api/imports/batches":
    "get":
      "operationId": "listImportBatches"
      "parameters": [{"name":"cursor","in":"query","required":false,"schema":{"type":"string","format":"uuid"}},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":100}}]
      "responses":
        "200":
          "description": "Owner-scoped result or idempotent replay"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImportBatchPage"
        "400":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "422":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "post":
      "operationId": "uploadImportSnapshot"
      "parameters": [{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}]
      "responses":
        "201":
          "description": "New draft saved"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImportBatch"
        "200":
          "description": "Owner-scoped result or idempotent replay"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImportBatch"
        "400":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "422":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ImportSnapshot"
  "/api/imports/batches/{batchId}":
    "get":
      "operationId": "getImportBatch"
      "parameters": [{"name":"batchId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      "responses":
        "200":
          "description": "Owner-scoped result or idempotent replay"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImportBatch"
        "400":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Safe import error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Safe import error"
          "content":
