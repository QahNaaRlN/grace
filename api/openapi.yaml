    post:
      operationId: createScheduledPaymentSettlement
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/ObligationId' }
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduledPaymentSettlement' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200': { $ref: '#/components/responses/Settlement' }
        '201': { $ref: '#/components/responses/Settlement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/assistant/query:
    post:
      operationId: queryAssistant
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      description: Route one natural-language request to an allowlisted read-only Grace capability. Disabled by default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantQuery' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Completed read-only result, clarification, or unsupported request
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/AssistantCompleted' }
                  - { $ref: '#/components/schemas/AssistantClarify' }
                  - { $ref: '#/components/schemas/AssistantUnsupported' }
                discriminator:
                  propertyName: status
                  mapping:
                    completed: '#/components/schemas/AssistantCompleted'
                    clarify: '#/components/schemas/AssistantClarify'
                    unsupported: '#/components/schemas/AssistantUnsupported'
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Assistant routing, provider, or a financial dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantUnavailable' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-grace_session
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: >-
        CSRF token from GET /api/auth/me, required with the exact browser Origin for
        mutations.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    AsOf:
      name: asOf
      in: query
      required: false
      description: Calendar date used to derive overdue state; defaults to current UTC date.
      schema: { type: string, format: date }
    ObligationId:
      name: obligationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    InternalError:
      description: Service temporarily unavailable; ordinary financial functions remain independent of AI.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ImportError:
      description: Safe import error with code and message; no private source values
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationError:
      description: Authentication/authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Event:
      description: Created event or result of an idempotent retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FinancialEvent' }
    Receipt:
      description: Confirmed receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    Obligation:
      description: Fixed obligation with its derived schedule state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Obligation' }
    Settlement:
      description: Link from one debt payment to one scheduled payment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScheduledPaymentSettlement' }
    ValidationError:
      description: Request violates the financial contract
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency key was used with another payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    PaymentReminderStatus:
      type: object
      required: [id, sourceKind, sourceId, dueOn, leadDays, status]
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [subscription, loan] }
        sourceId: { type: string, format: uuid }
        dueOn: { type: string, format: date }
        leadDays: { type: integer, enum: [1, 3] }
        status: { type: string, enum: [pending, dispatching, sent, cancelled, uncertain] }
    SubscriptionInput:
      type: object
      required: [name, amountMinor, currency, period, startsOn, endsOn, accountId, paymentInstrumentId, paused, reminders, revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        period: { type: string, enum: [weekly, monthly, yearly] }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        accountId: { type: [string, 'null'], format: uuid }
        paymentInstrumentId: { type: [string, 'null'], format: uuid }
        paused: { type: boolean }
        reminders: { type: boolean }
        revision: { type: integer, minimum: 0 }
    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionInput'
        - type: object
          required: [id, nextDueOn, expenseIds]
          properties:
            id: { type: string, format: uuid }
            nextDueOn: { type: [string, 'null'], format: date }
            expenseIds: { type: array, items: { type: string, format: uuid } }
    SubscriptionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
    SubscriptionExpense:
      type: object
      required: [financialEventId]
      properties:
        financialEventId: { type: string, format: uuid }
    LoanDetailsInput:
      type: object
      required: [lender, agreementNumber, agreementOn, principalMinor, annualRateBasisPoints, reminders, revision]
      properties:
        lender: { type: string, maxLength: 160 }
        agreementNumber: { type: string, maxLength: 160 }
        agreementOn: { type: [string, 'null'], format: date }
        principalMinor: { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        annualRateBasisPoints: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        reminders: { type: boolean }
        revision: { type: integer, minimum: 0 }
    LoanDetails:
      allOf:
        - $ref: '#/components/schemas/LoanDetailsInput'
        - type: object
          required: [documents, drafts]
          properties:
            documents: { type: array, items: { $ref: '#/components/schemas/LoanDocument' } }
            drafts: { type: array, items: { $ref: '#/components/schemas/PaymentScheduleDraft' } }
    LoanDocument:
      type: object
      required: [id, filename, version, sha256, size, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        version: { type: integer }
        sha256: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
    DraftPayment:
      type: object
      required: [sourceId, dueOn, amountMinor, paidMinor]
      properties:
        sourceId: { type: string }
        dueOn: { type: string, format: date }
