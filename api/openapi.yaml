openapi: 3.1.0
info:
  title: Grace API
  version: 0.5.0
  description: Deterministic financial events, receipts, obligations, and read-only analytics. Money uses integer minor units.
servers:
  - url: http://localhost:8080
paths:
  /api/meta:
    get:
      operationId: getMeta
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Accounts with balances derived from postings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/categories:
    get:
      operationId: listCategories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /api/v1/financial-events:
    get:
      operationId: listFinancialEvents
      responses:
        '200':
          description: Recent financial events with postings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FinancialEvent' }
  /api/v1/financial-events/purchases:
    post:
      operationId: createPurchase
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/incomes:
    post:
      operationId: createIncome
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/debt-payments:
    post:
      operationId: createDebtPayment
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingleAccountEvent' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/transfers:
    post:
      operationId: createTransfer
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransfer' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/financial-events/refunds:
    post:
      operationId: createRefund
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefund' }
      responses: { '200': { $ref: '#/components/responses/Event' }, '201': { $ref: '#/components/responses/Event' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/receipts:
    get:
      operationId: listReceipts
      responses:
        '200':
          description: Recent confirmed receipts with ordered items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Receipt' }
    post:
      operationId: createReceipt
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReceipt' }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '201': { $ref: '#/components/responses/Receipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/receipts/{receiptId}:
    get:
      operationId: getReceipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '404':
          description: Receipt not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/analytics/period-summary:
    get:
      operationId: getPeriodSummary
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive RFC 3339 boundary with an explicit UTC offset.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Exclusive RFC 3339 boundary with an explicit UTC offset.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Actual cash-flow and balance summary, separated by currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/analytics/cash-position:
    get:
      operationId: getCashPosition
      parameters:
        - { $ref: '#/components/parameters/AsOf' }
        - name: through
          in: query
          required: true
          description: Inclusive calendar horizon for outstanding scheduled payments.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Current liquid balance less known outstanding obligations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashPosition' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations:
    get:
      operationId: listObligations
      parameters:
        - { $ref: '#/components/parameters/AsOf' }
      responses:
        '200':
          description: Fixed obligations with derived schedule state
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Obligation' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createObligation
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateObligation' }
      responses:
        '200': { $ref: '#/components/responses/Obligation' }
        '201': { $ref: '#/components/responses/Obligation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations/{obligationId}:
    get:
      operationId: getObligation
      parameters:
        - { $ref: '#/components/parameters/ObligationId' }
        - { $ref: '#/components/parameters/AsOf' }
      responses:
        '200': { $ref: '#/components/responses/Obligation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations/{obligationId}/scheduled-payments/{paymentId}/settlements:
    post:
      operationId: createScheduledPaymentSettlement
      parameters:
        - { $ref: '#/components/parameters/ObligationId' }
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduledPaymentSettlement' }
      responses:
        '200': { $ref: '#/components/responses/Settlement' }
        '201': { $ref: '#/components/responses/Settlement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    AsOf:
      name: asOf
      in: query
      required: false
      description: Calendar date used to derive overdue state; defaults to current UTC date.
      schema: { type: string, format: date }
    ObligationId:
      name: obligationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Event:
      description: Created event or result of an idempotent retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FinancialEvent' }
    Receipt:
      description: Confirmed receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    Obligation:
      description: Fixed obligation with its derived schedule state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Obligation' }
    Settlement:
      description: Link from one debt payment to one scheduled payment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScheduledPaymentSettlement' }
    ValidationError:
      description: Request violates the financial contract
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency key was used with another payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Meta:
      type: object
      required: [service, version]
      properties:
        service: { type: string }
        version: { type: string }
    Account:
      type: object
      required: [id, name, type, currency, balanceMinor, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [debit, credit, installment, cash] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        balanceMinor: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    CreateAccount:
      type: object
      additionalProperties: false
      required: [name, type, currency, openingBalanceMinor]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [debit, credit, installment, cash] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        openingBalanceMinor: { type: integer, format: int64 }
    Category:
      type: object
      required: [id, name, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [expense, income] }
        createdAt: { type: string, format: date-time }
    Posting:
      type: object
      required: [id, accountId, accountName, direction, amountMinor, currency]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
    FinancialEvent:
      type: object
      required: [id, kind, source, merchant, description, occurredAt, createdAt, postings]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [purchase, income_received, internal_transfer, refund, debt_payment] }
        source: { type: string, enum: [manual, bank_import, receipt] }
        categoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        categoryName: { oneOf: [{ type: string }, { type: 'null' }] }
        originalEventId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        merchant: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        postings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Posting' }
    ExpenseCategorySummary:
      type: object
      required: [categoryId, categoryName, purchasesMinor, refundsMinor, netExpenseMinor]
      properties:
        categoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        categoryName: { type: string }
        purchasesMinor: { type: integer, format: int64, minimum: 0 }
        refundsMinor: { type: integer, format: int64, minimum: 0 }
        netExpenseMinor: { type: integer, format: int64 }
    CurrencyPeriodSummary:
      type: object
      required: [currency, openingBalanceMinor, closingBalanceMinor, incomeMinor, purchasesMinor, refundsMinor, debtPaymentsMinor, netExternalCashFlowMinor, internalTransferVolumeMinor, expenseCategories]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        openingBalanceMinor: { type: integer, format: int64 }
        closingBalanceMinor: { type: integer, format: int64 }
        incomeMinor: { type: integer, format: int64, minimum: 0 }
        purchasesMinor: { type: integer, format: int64, minimum: 0 }
        refundsMinor: { type: integer, format: int64, minimum: 0 }
        debtPaymentsMinor: { type: integer, format: int64, minimum: 0 }
        netExternalCashFlowMinor: { type: integer, format: int64 }
        internalTransferVolumeMinor: { type: integer, format: int64, minimum: 0 }
        expenseCategories:
          type: array
          items: { $ref: '#/components/schemas/ExpenseCategorySummary' }
    PeriodSummary:
      type: object
      required: [from, to, currencies]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        currencies:
          type: array
          items: { $ref: '#/components/schemas/CurrencyPeriodSummary' }
    CashScheduledPayment:
      type: object
      required: [scheduledPaymentId, obligationId, obligationName, dueOn, amountMinor, paidMinor, remainingMinor, timing]
      properties:
        scheduledPaymentId: { type: string, format: uuid }
        obligationId: { type: string, format: uuid }
        obligationName: { type: string }
        dueOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        paidMinor: { type: integer, format: int64, minimum: 0 }
        remainingMinor: { type: integer, format: int64, minimum: 1 }
        timing: { type: string, enum: [overdue, upcoming] }
    CurrencyCashPosition:
      type: object
      required: [currency, liquidBalanceMinor, overdueObligationsMinor, upcomingObligationsMinor, obligationsThroughMinor, availableAfterObligationsMinor, scheduledPayments]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        liquidBalanceMinor: { type: integer, format: int64 }
        overdueObligationsMinor: { type: integer, format: int64, minimum: 0 }
        upcomingObligationsMinor: { type: integer, format: int64, minimum: 0 }
        obligationsThroughMinor: { type: integer, format: int64, minimum: 0 }
        availableAfterObligationsMinor: { type: integer, format: int64 }
        scheduledPayments:
          type: array
          items: { $ref: '#/components/schemas/CashScheduledPayment' }
    CashPosition:
      type: object
      required: [asOf, through, currencies]
      properties:
        asOf: { type: string, format: date }
        through: { type: string, format: date }
        currencies:
          type: array
          items: { $ref: '#/components/schemas/CurrencyCashPosition' }
    CreateSingleAccountEvent:
      type: object
      additionalProperties: false
      required: [accountId, amountMinor, merchant, description, occurredAt]
      properties:
        accountId: { type: string, format: uuid }
        categoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        merchant: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    CreateTransfer:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, amountMinor, description, occurredAt]
      properties:
        sourceAccountId: { type: string, format: uuid }
        destinationAccountId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    CreateRefund:
      type: object
      additionalProperties: false
      required: [originalEventId, amountMinor, merchant, description, occurredAt]
      properties:
        originalEventId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        merchant: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    ReceiptItem:
      type: object
      required: [id, position, name, quantityMilli, unitPriceMinor, lineTotalMinor]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        name: { type: string }
        quantityMilli: { type: integer, format: int64, minimum: 1 }
        unitPriceMinor: { type: integer, format: int64, minimum: 1 }
        lineTotalMinor: { type: integer, format: int64, minimum: 1 }
    Receipt:
      type: object
      required: [id, purchaseEventId, seller, issuedAt, currency, totalMinor, fiscalDocumentNumber, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        purchaseEventId: { type: string, format: uuid }
        seller: { type: string }
        issuedAt: { type: string, format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totalMinor: { type: integer, format: int64, minimum: 1 }
        fiscalDocumentNumber: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReceiptItem' }
    CreateReceiptItem:
      type: object
      additionalProperties: false
      required: [name, quantityMilli, unitPriceMinor, lineTotalMinor]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        quantityMilli: { type: integer, format: int64, minimum: 1 }
        unitPriceMinor: { type: integer, format: int64, minimum: 1 }
        lineTotalMinor: { type: integer, format: int64, minimum: 1 }
    CreateReceipt:
      type: object
      additionalProperties: false
      required: [purchaseEventId, seller, issuedAt, items]
      properties:
        purchaseEventId: { type: string, format: uuid }
        seller: { type: string, minLength: 1, maxLength: 200 }
        issuedAt: { type: string, format: date-time }
        fiscalDocumentNumber: { type: string, maxLength: 160 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/CreateReceiptItem' }
    ScheduledPaymentSettlement:
      type: object
      required: [id, scheduledPaymentId, financialEventId, amountMinor, createdAt]
      properties:
        id: { type: string, format: uuid }
        scheduledPaymentId: { type: string, format: uuid }
        financialEventId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
    ScheduledPayment:
      type: object
      required: [id, position, dueOn, amountMinor, paidMinor, remainingMinor, status, isOverdue, settlements]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        dueOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        paidMinor: { type: integer, format: int64, minimum: 0 }
        remainingMinor: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [planned, overdue, partially_paid, paid] }
        isOverdue: { type: boolean }
        settlements:
          type: array
          items: { $ref: '#/components/schemas/ScheduledPaymentSettlement' }
    Obligation:
      type: object
      required: [id, name, kind, currency, totalMinor, paidMinor, remainingMinor, status, createdAt, payments]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [loan, installment, other_fixed] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totalMinor: { type: integer, format: int64, minimum: 1 }
        paidMinor: { type: integer, format: int64, minimum: 0 }
        remainingMinor: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [active, completed] }
        createdAt: { type: string, format: date-time }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ScheduledPayment' }
    CreateScheduledPayment:
      type: object
      additionalProperties: false
      required: [dueOn, amountMinor]
      properties:
        dueOn: { type: string, format: date }
        amountMinor: { type: integer, format: int64, minimum: 1 }
    CreateObligation:
      type: object
      additionalProperties: false
      required: [name, kind, currency, totalMinor, payments]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [loan, installment, other_fixed] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalMinor: { type: integer, format: int64, minimum: 1 }
        payments:
          type: array
          minItems: 1
          maxItems: 600
          items: { $ref: '#/components/schemas/CreateScheduledPayment' }
    CreateScheduledPaymentSettlement:
      type: object
      additionalProperties: false
      required: [financialEventId]
      properties:
        financialEventId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
