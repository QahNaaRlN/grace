openapi: 3.1.0
info:
  title: Grace API
  version: 0.7.0
  description: Deterministic financial events, receipts, obligations, confirmed import drafts, and read-only analytics. Money uses integer minor units.
servers:
  - url: http://localhost:8080
security:
  - SessionCookie: []
paths:
  /api/imports/statements/{statementId}/extraction-previews:
    post:
      operationId: previewStatementExtraction
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Owner-scoped statement state. No financial write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExtractionPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Original or complete local state was deleted. Minimal evidence remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Extractor or approved AI policy/provider is unavailable or disabled. Manual review remains
            available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementPreviewInput'
  /api/imports/statements/{statementId}/extraction-consents:
    post:
      operationId: consentStatementExtraction
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Owner-scoped statement state. No financial write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementConsent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Original or complete local state was deleted. Minimal evidence remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementConsentInput'
  /api/imports/statements/{statementId}/extractions:
    get:
      operationId: listStatementExtractions
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recent durable attempts; interrupted work never resumes inference.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatementExtractionAttempt'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Owner-scoped resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Original or complete local state was deleted. Minimal evidence remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: extractBankStatement
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Owner-scoped statement state. No financial write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExtractionAttempt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Original or complete local state was deleted. Minimal evidence remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Extraction is busy; Retry-After is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Extractor or approved AI policy/provider is unavailable or disabled. Manual review remains
            available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementExtractionInput'
  /api/imports/statements/{statementId}/extractions/{attemptId}:
    get:
      operationId: getStatementExtraction
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: string
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Owner-scoped statement state. No financial write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementExtractionAttempt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Original or complete local state was deleted. Minimal evidence remains.
          content:
            application/json:
