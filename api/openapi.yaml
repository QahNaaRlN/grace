        - type: object
          additionalProperties: false
          required: [mode, firstDueOn, count, interval, amountMinor]
          properties:
            mode: { type: string, const: equal }
            firstDueOn: { type: string, format: date }
            count: { type: integer, minimum: 1, maximum: 600 }
            interval: { type: string, enum: [monthly] }
