        '201': { $ref: '#/components/responses/Obligation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations/{obligationId}:
    get:
