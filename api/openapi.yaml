  /api/imports/statements/pdf:
    post:
      operationId: uploadBankStatement
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Owner-scoped result; no financial writes before explicit import
            confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResult'
        '201':
          description: Owner-scoped result; no financial writes before explicit import
            confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Upload or mapping exceeds the explicit byte limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Extraction is busy; Retry-After is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Extractor or approved AI policy/provider is unavailable or disabled.
            Manual review remains available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - accountId
              - file
              properties:
                accountId:
                  type: string
                file:
                  type: string
                  format: binary
                readingMode:
                  type: string
                  enum:
                  - plain_review
  /api/imports/statements/{statementId}:
    get:
      operationId: getBankStatement
      parameters:
