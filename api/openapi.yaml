          description: Receipt not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/analytics/period-summary:
    get:
      operationId: getPeriodSummary
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive RFC 3339 boundary with an explicit UTC offset.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Exclusive RFC 3339 boundary with an explicit UTC offset.
          schema: { type: string, format: date-time }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Actual cash-flow and balance summary, separated by currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/analytics/statistics:
    get:
      operationId: getStatistics
      description: Recorded events only; coverage does not certify a complete history. Calendar Asia/Yekaterinburg, maximum one year, isolated by owner.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date }, description: Inclusive calendar date }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: Exclusive calendar date }
        - { name: granularity, in: query, schema: { type: string, enum: [week, month], default: month } }
      responses:
        '200':
          description: Deterministic statistics, grouped by currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistics' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '503': { $ref: '#/components/responses/AuthenticationError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: Statistics calculation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/analytics/cash-position:
    get:
      operationId: getCashPosition
      parameters:
        - { $ref: '#/components/parameters/AsOf' }
        - name: through
          in: query
          required: true
          description: Inclusive calendar horizon for outstanding scheduled payments.
          schema: { type: string, format: date }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Current liquid balance less known outstanding obligations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashPosition' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations:
    get:
      operationId: listObligations
      parameters:
        - { $ref: '#/components/parameters/AsOf' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Fixed obligations with derived schedule state
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Obligation' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createObligation
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateObligation' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200': { $ref: '#/components/responses/Obligation' }
        '201': { $ref: '#/components/responses/Obligation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations/schedule-preview:
    post:
      operationId: previewObligationSchedule
      description: >-
        SPEC-0037. Builds explicit payments from equal monthly payments, a pasted
        bank table or edited rows. Writes nothing; the result is saved through
        createObligation or a loan schedule draft.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePreviewRequest' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Payments, their total computed by Grace, and rejected pasted lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: No payment could be recognised
          content:
            application/json:
              schema:
                type: object
                required: [code, message, rejectedLines]
                properties:
                  code: { type: string, const: no_payments }
                  message: { type: string }
                  rejectedLines:
                    type: array
                    items: { $ref: '#/components/schemas/RejectedScheduleLine' }
  /api/v1/obligations/{obligationId}:
    get:
      operationId: getObligation
      parameters:
        - { $ref: '#/components/parameters/ObligationId' }
        - { $ref: '#/components/parameters/AsOf' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200': { $ref: '#/components/responses/Obligation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/obligations/{obligationId}/scheduled-payments/{paymentId}/settlements:
    post:
      operationId: createScheduledPaymentSettlement
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/ObligationId' }
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduledPaymentSettlement' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '503':
          $ref: '#/components/responses/AuthenticationError'
        '200': { $ref: '#/components/responses/Settlement' }
        '201': { $ref: '#/components/responses/Settlement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/assistant/query:
    post:
      operationId: queryAssistant
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      description: Route one natural-language request to an allowlisted read-only Grace capability. Disabled by default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantQuery' }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthenticationError'
        '200':
          description: Completed read-only result, clarification, or unsupported request
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/AssistantCompleted' }
                  - { $ref: '#/components/schemas/AssistantClarify' }
                  - { $ref: '#/components/schemas/AssistantUnsupported' }
                discriminator:
                  propertyName: status
                  mapping:
                    completed: '#/components/schemas/AssistantCompleted'
                    clarify: '#/components/schemas/AssistantClarify'
                    unsupported: '#/components/schemas/AssistantUnsupported'
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Assistant routing, provider, or a financial dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantUnavailable' }
  /api/imports/statements/images:
    post:
      operationId: uploadBankStatementImage
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Owner-scoped result; no financial writes before explicit import
            confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResult'
        '201':
          description: Owner-scoped result; no financial writes before explicit import
            confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementUploadResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Upload or mapping exceeds the explicit byte limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Extraction is busy; Retry-After is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Extractor or approved AI policy/provider is unavailable or disabled.
            Manual review remains available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - accountId
              - file
              properties:
                accountId:
                  type: string
                file:
                  type: string
                  format: binary
                readingMode:
                  type: string
                  enum:
                  - plain_review
  /api/imports/statements/{statementId}/pages/{page}:
    parameters:
    - name: statementId
      in: path
      required: true
      schema:
        type: string
    - name: page
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getBankStatementPage
      responses:
        '200':
          description: Private normalized source image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '410':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/imports/statements/{statementId}/visual-reviews:
    parameters:
    - name: statementId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: reviewVisualBankStatement
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisualReviewInput'
      responses:
        '200':
          description: Owner-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/receipt-drafts/documents:
    post:
      operationId: uploadReceiptDocument
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDraft'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Owner-scoped receipt workflow result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDraft'

  /api/receipt-drafts/{draftId}/pages/{page}:
    parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
    - name: page
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getReceiptDocumentPage
      responses:
        '200':
          description: Private normalized source image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '410':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/receipt-drafts/{draftId}/reading-previews:
    parameters:
    - name: draftId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: previewReceiptReading
      parameters:
      - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Owner-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptReadingPlan'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/imports/statements/{statementId}/plain-reviews:
    parameters:
    - name: statementId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: reviewPlainBankStatement
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlainStatementReviewInput'
      responses:
        '200':
          description: Owner-scoped result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatement'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-grace_session
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: >-
        CSRF token from GET /api/auth/me, required with the exact browser Origin for
        mutations.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    AsOf:
      name: asOf
      in: query
      required: false
      description: Calendar date used to derive overdue state; defaults to current UTC date.
      schema: { type: string, format: date }
    ObligationId:
      name: obligationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    AccountConflict:
      description: Account changed meanwhile, type fixed by operations, or the reconciliation preview is stale
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FinancialEventConflict:
      description: Changed meanwhile, voided, or linked (links lists what blocks the change)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [revision_conflict, voided, linked] }
              message: { type: string }
              links: { type: array, items: { type: string } }
    InternalError:
      description: Service temporarily unavailable; ordinary financial functions remain independent of AI.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ImportError:
      description: Safe import error with code and message; no private source values
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationError:
      description: Authentication/authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Event:
      description: Created event or result of an idempotent retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FinancialEvent' }
    Receipt:
      description: Confirmed receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    Obligation:
      description: Fixed obligation with its derived schedule state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Obligation' }
    Settlement:
      description: Link from one debt payment to one scheduled payment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScheduledPaymentSettlement' }
    ValidationError:
      description: Request violates the financial contract
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency key was used with another payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    PlainStatementRow:
      type: object
      additionalProperties: false
      required:
      - id
      - raw
      - operationDate
      - bookingDate
      - transactionAmount
      - accountAmount
      - description
      - cardLast4
      - issues
      properties:
        id: &id001
          type: string
        raw:
          type: object
          additionalProperties:
            type: string
          maxProperties: 8
        operationDate:
          anyOf:
          - $ref: '#/components/schemas/StatementLocalDate'
          - type: 'null'
        bookingDate:
          anyOf:
          - $ref: '#/components/schemas/StatementLocalDate'
          - type: 'null'
        transactionAmount:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        accountAmount:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        description:
          type:
          - string
          - 'null'
        cardLast4:
          type:
          - string
          - 'null'
        issues:
          type: array
          items: *id001
    PlainStatementReading:
      type: object
      additionalProperties: false
      required:
      - version
      - rawAnswer
      - parseStatus
      - rows
      - header
      properties:
        version:
          type: string
          const: statement.plain.0058.v1
        rawAnswer:
          type: string
          maxLength: 262144
        parseStatus:
          type: string
          enum:
          - parsed
          - parse_error
          - manual
        rows:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlainStatementRow'
        header:
          type: object
          additionalProperties: *id001
          maxProperties: 7
    PlainStatementState:
      type: object
      additionalProperties: false
      required:
      - sourceSHA256
      - candidate
      - original
      - digest
      - reviewedDigest
      properties:
        sourceSHA256: *id001
        candidate:
          $ref: '#/components/schemas/PlainStatementReading'
        original:
          $ref: '#/components/schemas/PlainStatementReading'
        digest: *id001
        reviewedDigest: *id001
    PlainStatementReviewInput:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - sourceSHA256
      - draftDigest
      - reviewedPages
      - rolesConfirmed
      properties:
        expectedRevision:
          type: integer
        sourceSHA256: *id001
        draftDigest: *id001
        reviewedPages:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
          maxItems: 5
          uniqueItems: true
        rolesConfirmed:
          type: boolean
    StatementDocument:
      type: object
      additionalProperties: false
      required:
      - id
      - fileName
      - sha256
      - sizeBytes
      - contentType
      properties:
        id:
          type: string
        fileName:
          type: string
        sha256:
          type: string
        sizeBytes:
          type: integer
        contentType:
          type: string
    StatementUploadResult:
      type: object
      additionalProperties: false
      required:
      - statement
      - document
      - batchId
      properties:
        statement:
          $ref: '#/components/schemas/BankStatement'
        document:
          $ref: '#/components/schemas/StatementDocument'
        batchId:
          type:
          - string
          - 'null'
    StatementModelPolicy:
      type: object
      additionalProperties: false
      required:
      - model
      - provider
      - providerName
      - inputMicrosPerMillion
      - outputMicrosPerMillion
      properties:
        model:
          type: string
        provider:
          type: string
        providerName:
          type: string
        inputMicrosPerMillion:
          type: integer
        outputMicrosPerMillion:
          type: integer
        document:
          $ref: '#/components/schemas/DocumentModelPolicy'
    StatementRedactedSpan:
      type: object
      additionalProperties: false
      required:
      - id
      - page
      - x
      - y
      - text
      - lexicalClass
      properties:
        id:
          type: string
        page:
          type: integer
        x:
          type: integer
        y:
          type: integer
        text:
          type: string
        lexicalClass:
          type: string
          enum: [numeric_fragment, other]
          description: Server-derived token shape before redaction; never a financial role or value.

    StatementChunk:
      type: object
      additionalProperties: false
      required:
      - index
      - context
      - spans
      properties:
        index:
          type: integer
        context:
          type: array
          items:
            $ref: '#/components/schemas/StatementRedactedSpan'
        spans:
          type: array
          items:
            $ref: '#/components/schemas/StatementRedactedSpan'
    StatementPlanLimits:
      type: object
      additionalProperties: false
      required:
      - maxInputBytes
      - inputTokens
      - outputTokens
      - maxSpans
      - callTimeoutSeconds
      - attemptTimeoutSeconds
      properties:
        maxInputBytes:
          type: integer
          enum:
          - 90000
          - 12582912
        inputTokens:
          type: integer
          enum:
          - 100000
          - 30000
        outputTokens:
          type: integer
          enum:
          - 16000
        maxSpans:
          type: integer
          enum:
          - 2000
          - 0
        callTimeoutSeconds:
          type: integer
          enum:
          - 120
          - 180
        attemptTimeoutSeconds:
          type: integer
          enum:
          - 150
          - 210
    StatementPlan:
      type: object
      additionalProperties: false
      required:
      - plannerVersion
      - aliasVersion
      - atoms
      - aliases
      - limits
      - documentHash
      - promptVersion
      - schemaHash
      - redactionVersion
      - policy
      - chunks
      - maximumMicros
      properties:
        plannerVersion:
          type: string
        aliasVersion:
          type: string
        atoms:
          type: array
          items:
            type: array
            items:
              type: string
        aliases:
          type: object
          additionalProperties:
            type: string
        limits:
          $ref: '#/components/schemas/StatementPlanLimits'
        documentHash:
          type: string
        promptVersion:
          type: string
        schemaHash:
          type: string
        redactionVersion:
          type: string
        policy:
          $ref: '#/components/schemas/StatementModelPolicy'
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/StatementChunk'
        maximumMicros:
          type: integer
        document:
          $ref: '#/components/schemas/DocumentReadingPlan'
    StatementExtractionPreview:
      type: object
      additionalProperties: false
      required:
      - id
      - statementId
      - sourceRevision
      - hash
      - plan
      - expiresAt
      properties:
        id:
          type: string
        statementId:
          type: string
        sourceRevision:
          type: integer
        hash:
          type: string
        plan:
          $ref: '#/components/schemas/StatementPlan'
        expiresAt:
          type: string
    StatementPreviewInput:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      properties:
        expectedRevision:
          type: integer
        visibleSpanIds:
          type: array
          items:
            type: string
    StatementConsentInput:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - previewId
      - previewHash
      properties:
        expectedRevision:
          type: integer
        previewId:
          type: string
        previewHash:
          type: string
    StatementExtractionInput:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - previewId
      - previewHash
      - consentId
      properties:
        expectedRevision:
          type: integer
        previewId:
          type: string
        previewHash:
          type: string
        consentId:
          type: string
    StatementConsent:
      type: object
      additionalProperties: false
      required:
      - id
      - previewId
      properties:
        id:
          type: string
        previewId:
          type: string
    StatementExtractionAttempt:
      type: object
      additionalProperties: false
      required:
      - id
      - statementId
      - status
      - errorCode
      - batchId
      properties:
        policy:
          $ref: '#/components/schemas/StatementModelPolicy'
        promptVersion:
          type: string
        schemaHash:
          type: string
        redactionVersion:
          type: string
        id:
          type: string
        statementId:
          type: string
        status:
          type: string
        errorCode:
          type:
          - string
          - 'null'
        batchId:
          type:
          - string
          - 'null'
    StatementSpan:
      type: object
      additionalProperties: false
      required:
      - id
      - page
      - block
      - line
      - word
      - box
      - text
      properties:
        id:
          type: string
        page:
          type: integer
        block:
          type: integer
        line:
          type: integer
        word:
          type: integer
        box:
          type: object
          additionalProperties: false
          required:
          - xMin
          - yMin
          - xMax
          - yMax
          properties:
            xMin:
              type: number
            yMin:
              type: number
            xMax:
              type: number
            yMax:
              type: number
        text:
          type: string
    StatementLayout:
      type: object
      additionalProperties: false
      required:
      - extractor
      - pages
      - spans
      properties:
        extractor:
          type: string
        pages:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - number
            - width
            - height
            properties:
              number:
                type: integer
              width:
                type: number
              height:
                type: number
        spans:
          type: array
          items:
            $ref: '#/components/schemas/StatementSpan'
    StatementEvidence:
      type: object
      additionalProperties: false
      required:
      - role
      - spans
      - literal
      properties:
        role:
          type: string
        spans:
          type: array
          items:
            $ref: '#/components/schemas/StatementSpan'
        literal:
          type: string
        image:
          type: array
          items:
            $ref: '#/components/schemas/ImageQuote'
    StatementMoney:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - currency
      properties:
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
    StatementLocalDate:
      type: object
      additionalProperties: false
      required:
      - local
      - precision
      properties:
        local:
          type: string
        precision:
          type: string
        utc:
          type: string
        timeZone:
          type: string
    StatementRow:
      type: object
      additionalProperties: false
      required:
      - ordinal
      - operationDate
      - bookingDate
      - accountAmount
      - transactionAmount
      - direction
      - description
      - evidence
      - issues
      properties:
        ordinal:
          type: integer
        operationDate:
          anyOf:
          - $ref: '#/components/schemas/StatementLocalDate'
          - type: 'null'
        bookingDate:
          anyOf:
          - $ref: '#/components/schemas/StatementLocalDate'
          - type: 'null'
        accountAmount:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        transactionAmount:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        direction:
          type: string
        description:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/StatementEvidence'
        issues:
          type: array
          items:
            type: string
    StatementHeader:
      type: object
      additionalProperties: false
      required:
      - openingBookBalance
      - closingBookBalance
      - availableBalanceObserved
      - debitTurnover
      - creditTurnover
      - evidence
      - openingBookDate
      - closingBookDate
      properties:
        openingBookDate:
          anyOf:
          - $ref: '#/components/schemas/StatementLocalDate'
          - type: 'null'
        closingBookDate:
          anyOf:
          - $ref: '#/components/schemas/StatementLocalDate'
          - type: 'null'
        openingBookBalance:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        closingBookBalance:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        availableBalanceObserved:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        debitTurnover:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        creditTurnover:
          anyOf:
          - $ref: '#/components/schemas/StatementMoney'
          - type: 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/StatementEvidence'
    StatementCheck:
      type: object
      additionalProperties: false
      required:
      - status
      - reasons
      properties:
        status:
          type: string
        reasons:
          type: array
          items:
            type: string
    StatementReconciliation:
      type: object
      additionalProperties: false
      required:
      - turnoverCheck
      - bookBalanceCheck
      - rowCoverage
      - ledgerBalanceCheck
      - debitMinor
      - creditMinor
      - blockers
      - warnings
      properties:
        financialCoverage:
          $ref: '#/components/schemas/StatementCheck'
        turnoverCheck:
          $ref: '#/components/schemas/StatementCheck'
        bookBalanceCheck:
          $ref: '#/components/schemas/StatementCheck'
        rowCoverage:
          $ref: '#/components/schemas/StatementCheck'
        ledgerBalanceCheck:
          $ref: '#/components/schemas/StatementCheck'
        debitMinor:
          anyOf:
          - type: integer
          - type: 'null'
        creditMinor:
          anyOf:
          - type: integer
          - type: 'null'
        blockers:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    StatementReview:
      type: object
      additionalProperties: false
      required:
      - rows
      - header
      - reconciliation
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/StatementRow'
        header:
          $ref: '#/components/schemas/StatementHeader'
        reconciliation:
          $ref: '#/components/schemas/StatementReconciliation'
    StatementRowMapping:
      type: object
      additionalProperties: false
      required:
      - operationDate
      - bookingDate
      - accountAmount
      - accountCurrency
      - transactionAmount
      - transactionCurrency
      - description
      - directionEvidence
      - direction
      properties:
        operationDate:
          type: array
          items:
            type: string
        bookingDate:
          type: array
          items:
            type: string
        accountAmount:
          type: array
          items:
            type: string
