          "additionalProperties":
            "$ref": "#/components/schemas/ImportDate"
        "labels":
          "type": "object"
          "additionalProperties":
            "type": "string"
    "ImportSourceRecord":
      "type": "object"
      "additionalProperties": false
      "required": ["id","domain","raw","normalized","issues"]
      "properties":
        sourceKind:
          type: string
          enum: [spreadsheet, bank_statement_pdf, bank_statement_image]
        pdf:
          $ref: '#/components/schemas/ImportPDFSource'
        "id":
          "type": "string"
        "sheetId":
          "type": "integer"
          "format": "int64"
        "sheet":
          "type": "string"
        "row":
          "type": "integer"
        "domain":
          "type": "string"
        "originalId":
          "type": "string"
        "raw":
          "type": "object"
          "additionalProperties":
            "$ref": "#/components/schemas/ImportCell"
        "normalized":
          "$ref": "#/components/schemas/ImportNormalized"
        "issues":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportIssue"
    "ImportValue":
      "type": "object"
      "additionalProperties": false
      "required": []
      "properties":
        "numberValue":
          "type": "number"
          "description": "Original decimal token; upload original bytes to avoid JavaScript numeric rounding."
        "stringValue":
          "type": "string"
        "boolValue":
          "type": "boolean"
        "formulaValue":
          "type": "string"
    "ImportCell":
      "type": "object"
      "additionalProperties": false
      "required": []
      "properties":
        "userEnteredValue":
          "$ref": "#/components/schemas/ImportValue"
        "effectiveValue":
          "$ref": "#/components/schemas/ImportValue"
        "formattedValue":
          "type": "string"
        "note":
          "type": "string"
        "dataValidation":
          "type": "object"
          "additionalProperties": true
    "ImportSnapshot":
      "type": "object"
      "additionalProperties": false
      "required": ["schemaVersion","sourceId","capturedAt","locale","declaredTimeZone","confirmedTimeZone","sheets"]
      "properties":
        "schemaVersion":
          "type": "string"
          "enum": ["grace.sheet-snapshot.v1"]
        "sourceId":
          "type": "string"
        "capturedAt":
          "type": "string"
          "format": "date-time"
        "locale":
          "type": "string"
          "enum": ["ru_RU"]
        "declaredTimeZone":
          "type": "string"
        "confirmedTimeZone":
          "type": "string"
          "enum": ["Asia/Yekaterinburg"]
        "sheets":
          "type": "array"
          "items":
            "type": "object"
            "additionalProperties": false
            "required": ["sheetId","title","rowCount","columnCount","ranges"]
            "properties":
              "sheetId":
                "type": "integer"
                "format": "int64"
              "title":
                "type": "string"
              "rowCount":
                "type": "integer"
              "columnCount":
                "type": "integer"
              "ranges":
                "type": "array"
                "items":
                  "type": "object"
                  "additionalProperties": false
                  "required": ["startRow","startColumn","rows"]
                  "properties":
                    "startRow":
                      "type": "integer"
                      "minimum": 1
                    "startColumn":
                      "type": "integer"
                      "minimum": 1
                    "rows":
                      "type": "array"
                      "items":
                        "type": "object"
                        "additionalProperties": false
                        "required": ["values"]
                        "properties":
                          "values":
                            "type": "array"
                            "items":
                              "$ref": "#/components/schemas/ImportCell"
          "minItems": 1
          "maxItems": 20
        "mappings":
          "type": "object"
          "additionalProperties": false
          "required": []
          "properties":
            "accounts":
              "type": "object"
              "additionalProperties":
                "type": "string"
            "categories":
              "type": "object"
              "additionalProperties":
                "type": "string"
            "funding":
              "type": "object"
              "additionalProperties":
                "type": "object"
                "additionalProperties": false
                "required": ["kind"]
                "properties":
                  "kind":
                    "type": "string"
                  "facilityId":
                    "type": "string"
    ImportBatch:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - payloadHash
      - revision
      - status
      - createdAt
      - counts
      - domainCounts
      - fileName
      - format
      - periodFrom
      - periodTo
      - total
      - reviewed
      - needsReview
      - lastConfirmation
      properties:
        statementId:
          type: string
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/ImportMetadata'
        payloadHash:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - reviewing
          - completed
        createdAt:
          type: string
          format: date-time
        counts:
          type: object
          additionalProperties:
            type: integer
        domainCounts:
          type: object
          additionalProperties:
            type: integer
        fileName:
          type:
          - string
          - 'null'
          maxLength: 255
        format:
          type:
          - string
          - 'null'
          enum:
          - json
          - csv
          - bank_statement_pdf
          - null
          - bank_statement_image
        periodFrom:
          type:
          - string
          - 'null'
          format: date
          description: Earliest operation date among transaction rows.
        periodTo:
          type:
          - string
          - 'null'
          format: date
        total:
          type: integer
          minimum: 0
          description: Transaction rows.
        reviewed:
          type: integer
          minimum: 0
          description: Transaction rows with a decision or already published.
        needsReview:
          type: integer
          minimum: 0
          description: Unpublished rows with source issues or match candidates.
        lastConfirmation:
          oneOf:
          - $ref: '#/components/schemas/ImportConfirmationSummary'
          - type: 'null'
    "ImportConfirmationSummary":
      "type": "object"
      "additionalProperties": false
      "required": ["id","at","createdEvents","outcomes"]
      "properties":
        "id": { "type": "string", "format": "uuid" }
        "at": { "type": "string", "format": "date-time" }
        "createdEvents": { "type": "integer", "minimum": 0 }
        "outcomes": { "type": "integer", "minimum": 0 }
    "ImportRecordDomain":
      "type": "string"
      "enum": ["transaction","unsupported"]
    "ImportRecordStatus":
      "type": "string"
      "enum": ["needs_review","unresolved","create","link_existing","duplicate_of","exclude","published"]
    "ImportRecordFilter":
      "type": "object"
      "additionalProperties": false
      "properties":
        "domain": { "$ref": "#/components/schemas/ImportRecordDomain" }
        "status": { "$ref": "#/components/schemas/ImportRecordStatus" }
        "q": { "type": "string", "maxLength": 100 }
    "ImportCandidate":
      "type": "object"
      "additionalProperties": false
      "required": ["id","rule","differences"]
      "properties":
        "source": { "$ref": "#/components/schemas/ImportSourceRecord" }
        "event": { "$ref": "#/components/schemas/FinancialEvent" }
        "id":
          "type": "string"
        "recordId":
          "type": "string"
          "format": "uuid"
        "eventId":
          "type": "string"
          "format": "uuid"
        "rule":
          "type": "string"
        "differences":
          "type": "array"
          "items":
            "type": "string"
    "ImportAudit":
      "type": "object"
      "additionalProperties": false
      "required": ["revision","actorId","createdAt","decision"]
      "properties":
        "revision":
          "type": "integer"
          "format": "int64"
        "actorId":
          "type": "string"
          "format": "uuid"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "decision":
          "$ref": "#/components/schemas/ImportDecision"
    ImportRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - decision
      - published
      - candidates
      - history
      - eventId
      - questions
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/ImportSourceRecord'
        decision:
          $ref: '#/components/schemas/ImportDecision'
        published:
          type: boolean
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ImportCandidate'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ImportAudit'
        eventId:
          type:
          - string
          - 'null'
          format: uuid
        questions:
          type: integer
          minimum: 0
          description: Source issues plus match candidates involving this row.
    "ImportChange":
      "type": "object"
      "additionalProperties": false
      "required": ["accountId","accountName","currency","deltaMinor"]
      "properties":
        "accountName": { "type": "string" }
        "accountId":
          "type": "string"
          "format": "uuid"
        "currency":
          "type": "string"
        "deltaMinor":
          "type": "integer"
          "format": "int64"
    "ImportLine":
      "type": "object"
      "additionalProperties": false
      "required": ["recordId","decision","candidates","blockers","warnings","postings"]
      "properties":
        pdfOrdinal:
          type: integer
        sourceKind:
          type: string
        "sourceSheet": { "type": "string" }
        "sourceRow": { "type": "integer" }
        "recordId":
          "type": "string"
          "format": "uuid"
        "decision":
          "$ref": "#/components/schemas/ImportDecision"
        "sourceDate":
          "$ref": "#/components/schemas/ImportDate"
        "candidates":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportCandidate"
        "blockers":
          "type": "array"
          "items":
            "type": "string"
        "warnings":
          "type": "array"
          "items":
            "type": "string"
        "postings":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportChange"
    "ImportPreview":
      "type": "object"
      "additionalProperties": false
      "required": ["id","batchId","revision","hash","expiresAt","lines","changes","blockers","newEvents","links","exclusions"]
      "properties":
        statementRevision:
          type: integer
        "id":
          "type": "string"
          "format": "uuid"
        "batchId":
          "type": "string"
          "format": "uuid"
        "revision":
          "type": "integer"
          "format": "int64"
        "hash":
          "type": "string"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "lines":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportLine"
        "changes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportChange"
        "blockers":
          "type": "array"
          "items":
            "type": "string"
        "newEvents":
          "type": "integer"
        "links":
          "type": "integer"
        "exclusions":
          "type": "integer"
    "ImportReceipt":
      "type": "object"
      "additionalProperties": false
      "required": ["id","batchId","previewId","createdAt","outcomes"]
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "batchId":
          "type": "string"
          "format": "uuid"
        "previewId":
          "type": "string"
          "format": "uuid"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "outcomes":
          "type": "array"
          "items":
            "type": "object"
            "additionalProperties": false
            "required": ["recordId","action","eventId"]
            "properties":
              "recordId":
                "type": "string"
                "format": "uuid"
              "event": { "$ref": "#/components/schemas/FinancialEvent" }
              "action":
                "type": "string"
                "enum": ["create","link_existing","duplicate_of","exclude"]
              "eventId":
                "type": ["string","null"]
                "format": "uuid"
    "ImportEdit":
      "type": "object"
      "additionalProperties": false
      "required": ["expectedRevision","decision"]
      "properties":
        "expectedRevision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "decision":
          "$ref": "#/components/schemas/ImportDecision"
    "ImportSelection":
      "type": "object"
      "additionalProperties": false
      "description": "Either recordIds (up to 100) or filter (up to 1000 matching unpublished transaction rows), never both."
      "required": ["expectedRevision"]
      "properties":
        "expectedRevision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "recordIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
          "maxItems": 100
          "uniqueItems": true
        "filter":
          "$ref": "#/components/schemas/ImportRecordFilter"
    "ImportConfirmation":
      "type": "object"
      "additionalProperties": false
      "required": ["previewId","previewHash"]
      "properties":
        "previewId":
          "type": "string"
          "format": "uuid"
        "previewHash":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
    "ImportBatchPage":
      "type": "object"
      "additionalProperties": false
      "required": ["items"]
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportBatch"
        "nextCursor":
          "type": "string"
    "ImportRecordPage":
      "type": "object"
      "additionalProperties": false
      "required": ["items"]
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ImportRecord"
        "nextCursor":
          "type": "string"
        "total":
          "type": "integer"
          "minimum": 0
          "description": "Rows matching the filter."
    AuthUser:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarUrl: { oneOf: [{ type: string }, { type: 'null' }] }
        role:
          type: string
          enum:
            - admin
            - member
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 128 }
    PasswordRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, invitation]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 15, maxLength: 128 }
        invitation: { type: string, minLength: 43, maxLength: 43 }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
        password: { type: string, minLength: 15, maxLength: 128 }
    PasswordEmailResponse:
      type: object
      required: [message, resendAfterSeconds]
      properties:
        message: { type: string }
        resendAfterSeconds: { type: integer }
    PasswordInvitation:
      type: object
      required: [token, email, url, expiresAt]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required:
        - user
        - csrfToken
        - mode
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrfToken:
          type: string
        mode:
          type: string
          enum:
            - telegram
            - email
            - password
            - development
    AuthInvitation:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    AuthLogin:
      type: object
      additionalProperties: false
      properties:
        invitation:
          type: string
          minLength: 43
          maxLength: 43
    AuthLoginResult:
      type: object
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
    AssistantQuery:
      type: object
      additionalProperties: false
      required: [utterance, language, referenceTime]
      properties:
        utterance: { type: string, minLength: 1, maxLength: 2000 }
        language: { type: string, enum: [ru, en] }
        referenceTime:
          type: string
          format: date-time
          description: RFC 3339 timestamp with an explicit UTC offset.
    AssistantRoute:
      type: string
      enum: [get_accounts, get_period_summary, get_cash_position, get_obligations, get_receipts, get_period_since_income, clarify, unsupported]
    AssistantCompleted:
      type: object
      additionalProperties: false
      required: [status, route, confidence, data]
      properties:
        status: { type: string, const: completed }
        route:
          type: string
          enum: [get_accounts, get_obligations, get_receipts, get_period_since_income]
        confidence: { type: number, minimum: 0, maximum: 1 }
        data: { $ref: '#/components/schemas/AssistantToolResult' }
    AssistantClarify:
      type: object
      additionalProperties: false
      required: [status, route, confidence, clarificationCode]
      properties:
        status: { type: string, const: clarify }
        route: { $ref: '#/components/schemas/AssistantRoute' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        clarificationCode:
          type: string
          enum: [low_confidence, clarification_required, composition_mismatch, arguments_required, income_category_required, no_income_anchor, time_precision_required]
        requiredArguments:
          type: array
          uniqueItems: true
          items: { type: string, enum: [from, to, through, asOf, limit, categoryId] }
    AssistantUnsupported:
      type: object
      additionalProperties: false
      required: [status, route, confidence]
      properties:
        status: { type: string, const: unsupported }
        route: { type: string, const: unsupported }
        confidence: { type: number, minimum: 0, maximum: 1 }
    AssistantUnavailable:
      type: object
      additionalProperties: false
      required: [status, errorCode]
      properties:
        status: { type: string, const: unavailable }
        errorCode: { type: string, enum: [assistant_unavailable, dependency_unavailable] }
    AssistantToolResult:
      oneOf:
        - { $ref: '#/components/schemas/AssistantAccountsToolResult' }
        - { $ref: '#/components/schemas/AssistantObligationsToolResult' }
        - { $ref: '#/components/schemas/AssistantReceiptsToolResult' }
        - { $ref: '#/components/schemas/AssistantIncomePeriodToolResult' }
      discriminator:
        propertyName: name
        mapping:
          get_accounts: '#/components/schemas/AssistantAccountsToolResult'
          get_obligations: '#/components/schemas/AssistantObligationsToolResult'
          get_receipts: '#/components/schemas/AssistantReceiptsToolResult'
          get_period_since_income: '#/components/schemas/AssistantIncomePeriodToolResult'
    AssistantAccountsToolResult:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, const: get_accounts }
        data: { $ref: '#/components/schemas/AssistantAccountsResult' }
    AssistantObligationsToolResult:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, const: get_obligations }
        data: { $ref: '#/components/schemas/AssistantObligationsResult' }
    AssistantReceiptsToolResult:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, const: get_receipts }
        data: { $ref: '#/components/schemas/AssistantReceiptsResult' }
    AssistantIncomePeriodToolResult:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, const: get_period_since_income }
        data: { $ref: '#/components/schemas/IncomeRelativePeriod' }
    AssistantAccountsResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
    AssistantObligationsResult:
      type: object
      required: [asOf, items]
      properties:
        asOf: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
    AssistantReceiptsResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
    IncomeAnchorPosting:
      type: object
      required: [accountId, accountName, amountMinor, currency]
      properties:
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    IncomeAnchor:
      type: object
      required: [eventId, categoryId, categoryName, occurredAt, postings]
      properties:
        eventId: { type: string, format: uuid }
        categoryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        categoryName: { oneOf: [{ type: string }, { type: 'null' }] }
        occurredAt: { type: string, format: date-time }
        postings: { type: array, minItems: 1, items: { $ref: '#/components/schemas/IncomeAnchorPosting' } }
    IncomeRelativePeriod:
      type: object
      required: [anchor, summary]
      properties:
        anchor: { $ref: '#/components/schemas/IncomeAnchor' }
        summary: { $ref: '#/components/schemas/PeriodSummary' }
    Meta:
      type: object
      required: [service, version]
      properties:
        service: { type: string }
        version: { type: string }
    Account:
      type: object
      required: [id, name, type, currency, balanceMinor, balanceReconciled, createdAt, revision, hasOperations, lastReconciliation, lastImportConfirmedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [debit, credit, installment, cash] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        balanceMinor: { type: [integer, "null"], format: int64 }
        balanceReconciled: { type: boolean }
        createdAt: { type: string, format: date-time }
        paymentInstruments:
          type: array
          description: Active cards first, then disabled ones.
          items: { $ref: '#/components/schemas/PaymentInstrument' }
        revision: { type: integer, minimum: 1 }
        hasOperations: { type: boolean }
        lastReconciliation:
          oneOf:
            - { $ref: '#/components/schemas/LastReconciliation' }
            - { type: 'null' }
        lastImportConfirmedAt: { type: [string, 'null'], format: date-time }
    LastReconciliation:
      type: object
      required: [asOf, outcome, statedMinor, differenceMinor, createdAt, stale]
      properties:
        asOf: { type: string, format: date-time }
        outcome: { $ref: '#/components/schemas/ReconciliationOutcome' }
        statedMinor: { type: integer, format: int64 }
        differenceMinor: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        stale: { type: boolean, description: Operations up to asOf changed since; the account needs a new reconciliation. }
    ReconciliationOutcome:
      type: string
      enum: [matched, opening_set, adjusted]
    AccountUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [debit, credit, installment, cash] }
    PaymentInstrumentUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        bank: { type: string, minLength: 1, maxLength: 160 }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        disabled: { type: boolean }
    ReconciliationInput:
      type: object
      additionalProperties: false
      required: [asOf, statedMinor]
      properties:
        asOf: { type: string, format: date-time, description: Not in the future. }
        statedMinor: { type: integer, format: int64, description: Balance from the bank in minor units of the account currency. }
        previewHash: { type: string, description: Required to confirm; from the preview. }
    ReconciliationPreview:
      type: object
      required: [asOf, statedMinor, currency, computedMinor, differenceMinor, outcome, proposedOpeningMinor, previewHash]
      properties:
        asOf: { type: string, format: date-time }
        statedMinor: { type: integer, format: int64 }
        currency: { type: string }
        computedMinor: { type: integer, format: int64, description: Grace balance at asOf; for an unreconciled account only the net of its operations. }
        differenceMinor: { type: integer, format: int64 }
        outcome: { $ref: '#/components/schemas/ReconciliationOutcome' }
        proposedOpeningMinor: { type: [integer, 'null'], format: int64 }
