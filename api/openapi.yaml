      properties:
        name: { type: string, const: get_accounts }
        data: { $ref: '#/components/schemas/AssistantAccountsResult' }
    AssistantObligationsToolResult:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, const: get_obligations }
        data: { $ref: '#/components/schemas/AssistantObligationsResult' }
    AssistantReceiptsToolResult:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name: { type: string, const: get_receipts }
        data: { $ref: '#/components/schemas/AssistantReceiptsResult' }
