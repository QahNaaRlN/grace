            interestColumn: { type: integer, minimum: 1, maximum: 12 }
            otherColumn: { type: integer, minimum: 1, maximum: 12, description: Without it, other charges are the payment minus principal and interest. }
        - type: object
          additionalProperties: false
          required: [mode, payments]
          properties:
            mode: { type: string, const: rows }
            payments:
              type: array
              minItems: 1
              maxItems: 600
